name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - run: go mod download

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: ./...

  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - run: go mod download

      # The scan engine, the poller pool and the shared app state are all
      # concurrent, so the race detector is the point of this job.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...
